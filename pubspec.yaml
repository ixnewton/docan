name: docan
description: "Universal AI chat application with Liquid Glass design"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0
  
  # State Management
  provider: ^6.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  
  # UI Components
  flutter_markdown: ^0.6.18
  flutter_highlight: ^0.7.0
  google_fonts: ^6.1.0
  
  # Platform-specific
  cupertino_icons: ^1.0.6
  
  # Utilities
  uuid: ^4.3.3
  intl: ^0.18.1
  
  # Animations
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
