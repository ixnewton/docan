name: docan
description: "Universal AI chat application"
publish_to: 'none'
version: 3.0.2

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0
  
  # State Management
  provider: ^6.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  
  # UI Components
  flutter_markdown: ^0.6.18
  flutter_highlight: ^0.7.0
  google_fonts: ^6.1.0
  
  # Platform-specific
  cupertino_icons: ^1.0.6
  
  # Utilities
  uuid: ^4.3.3
  intl: ^0.18.1
  url_launcher: ^6.2.1
  package_info_plus: ^8.0.0
  crypto: ^3.0.3
  
  # File picking
  file_picker: ^8.0.0
  image_picker: ^1.0.7
  mime: ^2.0.0
  desktop_drop: ^0.5.0
  
  # Animations
  flutter_animate: ^4.5.0
  yaml: ^3.1.3
  path_provider: ^2.1.5
  flutter_math_fork: ^0.7.4
  markdown: ^7.3.0
  cross_file: ^0.3.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/playbooks/
